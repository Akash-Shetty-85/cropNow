<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ✅ Title & Meta Description for SEO -->
    <title>CropNow | For a Better India</title>
    <meta name="description" content="CropNow helps Indian farmers with smart solutions for better crop yield and sustainability." />
    <meta name="author" content="CropNow Team" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />

    <!-- ✅ Open Graph Meta Tags for Social Media -->
    <meta property="og:title" content="CropNow | For a Better India" />
    <meta property="og:description" content="Empowering farmers with AI-driven agricultural insights." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://cropnow.in" />
    <meta property="og:type" content="website" />

    <!-- ✅ Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CropNow | For a Better India" />
    <meta name="twitter:description" content="Empowering farmers with AI-driven agricultural insights." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- ✅ Favicons -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />

    <!-- ✅ Load Styles Efficiently -->
    <link rel="stylesheet" href="/src/index.css" />

    <!-- ✅ Performance Optimization: Defer Non-Essential JS -->
    <script type="module" src="/src/main.jsx" defer></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
