<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ✅ Title & Meta Description for SEO -->
    <title>CropNow | For a Better India</title>
    <meta name="description" content="CropNow empowers Indian farmers with AI-driven agricultural insights, smart solutions for better crop yield, and sustainable farming practices." />
    <meta name="author" content="CropNow Team" />
    <link rel="canonical" href="https://cropnow.in" />

    <!-- ✅ Content Security Policy -->
    <meta http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data:;
        connect-src 'self' https://script.google.com https://*.googleusercontent.com;
        font-src 'self' data:;
      " />

    <!-- ✅ Open Graph Meta Tags (for Social Media) -->
    <meta property="og:title" content="CropNow | For a Better India" />
    <meta property="og:description" content="Empowering farmers with AI-driven agricultural insights and smart farming systems." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://cropnow.in" />
    <meta property="og:type" content="website" />

    <!-- ✅ Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CropNow | For a Better India" />
    <meta name="twitter:description" content="Empowering farmers with AI-driven agricultural insights." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- ✅ Favicons -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16" />

    <!-- ✅ Preload & Styles -->
    <link rel="preload" href="/src/index.css" as="style" />
    <link rel="stylesheet" href="/src/index.css" />

    <!-- ✅ Performance Optimization: Load React entry point deferred -->
    <script type="module" src="/src/main.jsx" defer></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
